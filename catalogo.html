<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080609">
  <meta name="description" content="Catálogo de criações e peças personalizadas da HG 3D.">
  <title>Catálogo | HG 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-page">
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="grid-glow" aria-hidden="true"></div>

  <main class="gallery-shell">
    <header class="gallery-header glass-panel">
      <a class="gallery-logo" href="index.html" aria-label="Voltar para a página inicial da HG 3D">
        <img src="assets/fotos/LOGO.svg" alt="HG 3D">
      </a>
      <p class="eyebrow">FEITO EM CAMADAS</p>
      <h1>Catálogo <span>HG 3D</span></h1>
      <p class="gallery-intro">Explore nossas criações. Toque ou clique em uma imagem para ampliar e clique novamente para voltar ao tamanho normal.</p>
    </header>

    <p id="gallery-status" class="gallery-status" role="status">Carregando as criações...</p>
    <section id="gallery-grid" class="gallery-grid" aria-label="Galeria de produtos HG 3D"></section>
  </main>

  <a class="floating-home" href="index.html" aria-label="Voltar para a página inicial" title="Voltar para a Home">
    <i class="bi bi-house-fill" aria-hidden="true"></i>
    <span>Home</span>
  </a>

  <script src="gallery.js"></script>
</body>
</html>
